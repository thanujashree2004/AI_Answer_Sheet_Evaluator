<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Evaluation Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0">📊 Question-wise Result</h4>
        </div>

        <div class="card-body">

            <div id="resultArea"></div>

        </div>

    </div>

</div>

<script>
const jobId = "{{ job_id }}";
const resultArea = document.getElementById("resultArea");

function renderDone(data) {

    const results = data.question_results || [];
    const total = data.total_marks || 0;

    let rows = "";

    results.forEach(q => {

        rows += `
            <tr>
                <td>Q${q.question}</td>
                <td>
                    <span class="badge bg-success">
                        ${q.marks}
                    </span>
                </td>
                <td>${q.max_marks}</td>
            </tr>
        `;
    });

    resultArea.innerHTML = `

        <!-- TOTAL -->
        <div class="text-center mb-3">
            <h5>Total Marks: ${total}</h5>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped text-center align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Question</th>
                        <th>Marks Obtained</th>
                        <th>Max Marks</th>
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>
    `;
}

function poll() {

    fetch(`/status/${jobId}`)
        .then(res => res.json())
        .then(job => {

            if (job.error) {
                resultArea.innerHTML = `
                    <div class="alert alert-danger text-center">
                        Job not found — the server may have restarted.
                        Please re-upload and try again.
                    </div>
                `;
                return;
            }

            if (job.status === "processing") {
                resultArea.innerHTML = `
                    <div class="alert alert-info text-center">
                        Still processing... checking again in 2s.
                    </div>
                `;
                setTimeout(poll, 2000);
                return;
            }

            if (job.status === "error") {
                resultArea.innerHTML = `
                    <div class="alert alert-danger text-center">
                        Evaluation failed: ${job.result}
                    </div>
                `;
                return;
            }

            // status === "done"
            renderDone(job.result);
        });
}

poll();
</script>

</body>
</html>
