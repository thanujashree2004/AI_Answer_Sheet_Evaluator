<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Answer Sheet Evaluator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center min-vh-100 align-items-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h2 class="mb-0">AI Answer Sheet Evaluator</h2>
                    </div>

                    <div class="card-body">

                        <!-- ANSWER KEY SECTION -->

                        <p class="text-center text-muted">
                            Upload Answer Key (.txt)
                        </p>

                        <div class="mb-3">
                            <label class="form-label">Select Answer Key</label>
                            <input
                                type="file"
                                id="answerKey"
                                accept=".txt"
                                class="form-control">
                        </div>

                        <div class="d-grid">
                            <button
                                class="btn btn-success"
                                onclick="uploadAnswerKey()">
                                Upload Answer Key
                            </button>
                        </div>

                        <div id="answerKeyMessage" class="mt-3"></div>

                        <hr class="my-4">

                        <!-- STUDENT PDF SECTION -->

                        <p class="text-center text-muted">
                            Upload a PDF answer sheet for evaluation
                        </p>

                        <div class="mb-3">
                            <label class="form-label">Select PDF File</label>
                            <input
                                type="file"
                                id="file"
                                accept=".pdf"
                                class="form-control">
                        </div>

                        <div class="d-grid">
                            <button
                                class="btn btn-primary btn-lg"
                                onclick="uploadFile()">
                                Upload PDF
                            </button>
                        </div>

                        <div id="messageBox" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // ANSWER KEY UPLOAD

        async function uploadAnswerKey() {

            const file =
                document.getElementById("answerKey").files[0];

            const messageBox =
                document.getElementById("answerKeyMessage");

            if (!file) {

                messageBox.innerHTML = `
                    <div class="alert alert-warning">
                        Please select an answer key file.
                    </div>
                `;
                return;
            }

            const formData = new FormData();

            formData.append("answer_key", file);

            messageBox.innerHTML = `
                <div class="alert alert-info">
                    Uploading Answer Key...
                </div>
            `;

            try {

                const response =
                    await fetch("/upload-answer-key", {
                        method: "POST",
                        body: formData
                    });

                const data = await response.json();

                messageBox.innerHTML = `
                    <div class="alert alert-success">
                        ${data.message || "Answer key uploaded successfully ✅"}
                    </div>
                `;

            }
            catch (error) {

                messageBox.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to upload answer key ❌
                    </div>
                `;
            }
        }


        // EXISTING PDF UPLOAD FUNCTION
        // UNCHANGED

        async function uploadFile() {

            const file = document.getElementById("file").files[0];
            const messageBox = document.getElementById("messageBox");

            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            messageBox.innerHTML = "Uploading...";

            try {

                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                const jobId = data.job_id;

                messageBox.innerHTML = "Processing AI evaluation...";

                const interval = setInterval(async () => {

                    const res = await fetch(`/status/${jobId}`);
                    const result = await res.json();

                    if (result.status === "done") {

                        clearInterval(interval);

                        window.location.href = `/result/${jobId}`;

                        messageBox.innerHTML = `
                            <div class="alert alert-success">
                                Evaluation Completed ✅
                            </div>
                        `;
                    }

                    if (result.status === "error") {

                        clearInterval(interval);

                        messageBox.innerHTML =
                            "Error in evaluation ❌";
                    }

                }, 2000);

            }
            catch (error) {

                console.error("FULL ERROR:", error);

                messageBox.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Backend Error ❌</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        function viewResult() {
            window.location.href = "result.html";
        }

    </script>

</body>

</html>
