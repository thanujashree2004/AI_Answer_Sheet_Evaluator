<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Evaluation Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="index.html">AI Evaluation System</a>
</div>
</nav>

<div class="container py-4">

<h2 class="mb-4">Evaluation Dashboard</h2>

<!-- UPLOAD SECTION -->
<div class="row g-4">

<div class="col-md-6">
<div class="card shadow-sm">
<div class="card-body">

<h5>Upload Answer Key</h5>
<input type="file" class="form-control">

</div>
</div>
</div>

<div class="col-md-6">
<div class="card shadow-sm">
<div class="card-body">

<h5>Upload Student PDFs</h5>
<input type="file" class="form-control" multiple>

</div>
</div>
</div>

</div>

<!-- BUTTON -->
<div class="text-center mt-4">
<button class="btn btn-success btn-lg">
Start Evaluation
</button>
</div>

<!-- PROCESS -->
<div class="mt-5">

<h4>Processing Status</h4>

<div class="progress mb-2">
<div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 60%"></div>
</div>

<div class="alert alert-info">OCR Processing...</div>
<div class="alert alert-warning">Evaluating Answers...</div>
<div class="alert alert-success">Report Generated</div>

</div>

<!-- RESULTS -->
<div class="mt-5">

<h4>Student Results</h4>

<table class="table table-bordered table-hover">

<thead class="table-primary">
<tr>
<th>Student</th>
<th>Marks</th>
<th>Status</th>
<th>Report</th>
</tr>
</thead>

<tbody>
<tr>
<td>Student 1</td>
<td>78</td>
<td><span class="badge bg-success">Pass</span></td>
<td><button class="btn btn-sm btn-primary">View</button></td>
</tr>

<tr>
<td>Student 2</td>
<td>62</td>
<td><span class="badge bg-success">Pass</span></td>
<td><button class="btn btn-sm btn-primary">View</button></td>
</tr>

<tr>
<td>Student 3</td>
<td>45</td>
<td><span class="badge bg-danger">Fail</span></td>
<td><button class="btn btn-sm btn-primary">View</button></td>
</tr>
</tbody>

</table>

</div>

</div>

</body>
</html>
