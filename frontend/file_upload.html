<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Answer Sheet Evaluator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center min-vh-100 align-items-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h2 class="mb-0">AI Answer Sheet Evaluator</h2>
                    </div>

                    <div class="card-body">

                        <p class="text-center text-muted">
                            Upload a PDF answer sheet for evaluation
                        </p>

                        <div class="mb-3">
                            <label class="form-label">Select PDF File</label>
                            <input type="file" id="file" accept=".pdf" class="form-control">
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" onclick="uploadFile()">
                                Upload PDF
                            </button>
                        </div>

                        <div id="messageBox" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

async function uploadFile() {

    const file = document.getElementById("file").files[0];
    const messageBox = document.getElementById("messageBox");

    if (!file) {

        messageBox.innerHTML = `
            <div class="alert alert-warning">
                Please select a PDF file first.
            </div>
        `;
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    messageBox.innerHTML = `
        <div class="alert alert-info">
            AI Evaluation Started ⏳
            <br>
            Please wait...
        </div>
    `;

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/upload",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        console.log(data);

        if (!response.ok) {

            messageBox.innerHTML = `
                <div class="alert alert-danger">
                    Upload Failed ❌
                </div>
            `;
            return;
        }

        messageBox.innerHTML = `
            <div class="alert alert-success">
                <h5>Evaluation Completed ✅</h5>
                <hr>
                <strong>Total Marks:</strong> ${data.total_marks}
            </div>
        `;

    }
    catch (error) {

        console.error(error);

        messageBox.innerHTML = `
            <div class="alert alert-danger">
                Backend Error ❌
            </div>
        `;
    }
}

</script>

</body>

</html>
