<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Answer Sheet Evaluator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center min-vh-100 align-items-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header text-center">
                        <h2 class="mb-0">AI Answer Sheet Evaluator</h2>
                    </div>

                    <div class="card-body">

                        <p class="text-center text-muted">
                            Upload a PDF answer sheet for evaluation
                        </p>

                        <div class="mb-3">
                            <label class="form-label">Select PDF File</label>
                            <input type="file" id="file" accept=".pdf" class="form-control">
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" onclick="uploadFile()">
                                Upload PDF
                            </button>
                        </div>

                        <div id="messageBox" class="mt-4"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        let currentJobId = null;

        async function uploadFile() {

            const file = document.getElementById("file").files[0];
            const messageBox = document.getElementById("messageBox");

            if (!file) {
                messageBox.innerHTML = `
                    <div class="alert alert-warning">
                        Please select a PDF file first.
                    </div>
                `;
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {

                // STEP 1
                messageBox.innerHTML = `
                    <div class="alert alert-success">
                        PDF Uploaded Successfully ✅
                    </div>
                `;

                // STEP 2
                messageBox.innerHTML = `
                    <div class="alert alert-info">
                        Execution Started ⏳<br>
                        Please wait while AI evaluates your answer sheet...
                    </div>
                `;

                // STEP 3: send file → get job_id
                const response = await fetch("http://127.0.0.1:5000/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                console.log(data);

                if (!response.ok) {
                    messageBox.innerHTML = `
                        <div class="alert alert-danger">
                            Upload Failed ❌
                        </div>
                    `;
                    return;
                }

                currentJobId = data.job_id;

                // STEP 4: start polling backend
                pollStatus(currentJobId);

            } catch (error) {

                console.error(error);

                messageBox.innerHTML = `
                    <div class="alert alert-danger">
                        Backend not responding ❌
                    </div>
                `;
            }
        }

        // =========================================================
        // POLLING FUNCTION (REAL-TIME STATUS CHECK)
        // =========================================================

        async function pollStatus(jobId) {

            const messageBox = document.getElementById("messageBox");

            const interval = setInterval(async () => {

                try {

                    const res = await fetch(`http://127.0.0.1:5000/status/${jobId}`);
                    const data = await res.json();

                    console.log(data);

                    if (data.status === "processing") {

                        messageBox.innerHTML = `
                            <div class="alert alert-info">
                                <strong>Processing ⏳</strong><br>
                                AI is evaluating your answer sheet...
                            </div>
                        `;
                    }

                    if (data.status === "done") {

                        clearInterval(interval);

                        messageBox.innerHTML = `
                            <div class="alert alert-success">
                                <h5>Execution Completed ✅</h5>
                                <hr>
                                <strong>Total Marks:</strong> ${data.result.total_marks}
                                <br><br>
                                <button class="btn btn-primary" onclick="openResult()">
                                    Open Result
                                </button>
                            </div>
                        `;
                    }

                    if (data.status === "error") {

                        clearInterval(interval);

                        messageBox.innerHTML = `
                            <div class="alert alert-danger">
                                Execution Failed ❌
                            </div>
                        `;
                    }

                } catch (err) {

                    console.error(err);

                    clearInterval(interval);

                    messageBox.innerHTML = `
                        <div class="alert alert-danger">
                            Error while checking status ❌
                        </div>
                    `;
                }

            }, 2000); // every 2 seconds
        }

        function openResult() {
            window.location.href = "result.html";
        }

    </script>

</body>

</html>
