<!DOCTYPE html>
<html>
<head>
    <title>Upload Test</title>
</head>
<body>

    <h2>PDF Upload Test</h2>

    <input type="file" id="file">

    <button onclick="uploadFile()">
        Upload
    </button>

    <script>

        async function uploadFile() {

            const file =
            document.getElementById("file")
            .files[0];

            const formData =
            new FormData();

            formData.append(
                "file",
                file
            );

            const response =
            await fetch(
                "http://127.0.0.1:5000/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            const data =
            await response.json();

            console.log(data);

            alert(data.message);
        }

    </script>

</body>
</html>
